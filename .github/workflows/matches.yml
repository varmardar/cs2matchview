name: BO3 match cache (optional)
on:
  workflow_dispatch:
  schedule:
    - cron: '*/5 * 24-30 11 *'
    - cron: '*/5 * 1-13 12 *'
permissions:
  contents: write
concurrency:
  group: bo3-cache
  cancel-in-progress: false
jobs:
  fetch:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v4
      - name: Retrieve matches
        run: python3 fetch_matches.py
      - name: Update cache
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add matches.json
          git diff --cached --quiet || git commit -m 'Update match cache'
          git push
