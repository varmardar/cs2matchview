<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>CS2 Major</title>
<style>
:root{color-scheme:dark;--panel:rgba(16,18,22,.96);--ink:#fff;--muted:#a7abb2}
*{box-sizing:border-box}html,body{margin:0;background:transparent;color:var(--ink);font-family:Arial,Helvetica,sans-serif}main{width:min(100%,1050px);padding:6px;margin:0 auto}.matches{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}.match{background:var(--panel);border-radius:5px;min-width:0;padding:10px 14px 8px}.scoreboard{display:grid;grid-template-columns:minmax(0,1fr) auto minmax(0,1fr);gap:10px;align-items:center}.team{display:flex;align-items:center;justify-content:flex-end;gap:8px;min-width:0}.team:last-child{flex-direction:row-reverse;justify-content:flex-end}.logo{width:30px;height:30px;object-fit:contain;flex:0 0 30px;display:grid;place-items:center;font-size:12px;font-weight:700;color:var(--muted)}.name{font-size:14px;line-height:1.15;font-weight:700;overflow-wrap:anywhere;min-width:0}.scores{font-size:30px;line-height:1;font-weight:800;font-variant-numeric:tabular-nums;white-space:nowrap;text-align:center}.map{color:var(--muted);font-size:11px;text-align:center;margin-top:5px;line-height:1.2}.empty{grid-column:1/-1;background:var(--panel);padding:12px;border-radius:5px;color:var(--muted);text-align:center;font-size:13px}footer{display:flex;justify-content:space-between;align-items:center;gap:8px;margin-top:4px;font-size:9px;color:#ccc;text-shadow:0 1px 3px #000}#state{color:#ffcb80}#state:empty{display:none}footer span:last-child{margin-left:auto}body.vertical .matches{grid-template-columns:1fr}body.vertical main{max-width:550px}@media(max-width:650px){.matches{grid-template-columns:1fr}}@media(max-width:320px){.match{padding:8px}.scoreboard{gap:5px}.team{gap:4px}.logo{width:23px;height:23px;flex-basis:23px}.name{font-size:12px}.scores{font-size:24px}}
</style>
</head>
<body><main><section class="matches" id="matches" aria-label="PGL Major Singapore 2026 – Live-Matches"></section><footer><span id="state" role="status">Verbinde …</span><span>Daten: esport.vision</span></footer></main>
<script>
'use strict';
const API = 'https://cs2-major-api.zerpihd.workers.dev/matches';
const INTERVAL = 15000;
const $ = id => document.getElementById(id);
const node = (tag, text, cls) => { const el = document.createElement(tag); el.textContent = text ?? ''; if (cls) el.className = cls; return el; };
const fmt = scores => (scores || [null,null]).map(n => Number.isInteger(n) ? n : '–').join(' : ');
function team(t) {
  const box = node('div','','team');
  const fallback = node('div',t.name.slice(0,3).toUpperCase(),'logo');
  box.append(fallback);
  if (t.logo) {try {const url=new URL(t.logo.replace(/&amp;/g,'&'));if(url.origin==='https://esport.vision'){const img=document.createElement('img');img.className='logo';img.alt='';img.onload=()=>fallback.replaceWith(img);img.src=url.href;}} catch {}}
  box.append(node('div',t.name,'name'));return box;
}
let lastGood=0, lastMatches=[];
function render(matches) {
  const list=$('matches');list.replaceChildren();
  if (!matches.length) { list.append(node('div','Momentan kein Major-Match live.','empty'));return; }
  for (const m of matches.slice(0,2)) {
    const card=node('article','','match');
    const board=node('div','','scoreboard');
    board.append(team(m.teams[0]),node('div',fmt(m.rounds),'scores'),team(m.teams[1]));
    const hasRounds=Array.isArray(m.rounds)&&m.rounds.length===2&&m.rounds.every(Number.isInteger);
    const hasSeries=Array.isArray(m.series)&&m.series.length===2&&m.series.every(Number.isInteger)&&m.series.some(n=>n>0);
    const label=[m.map||'Map offen',hasSeries?'Maps '+fmt(m.series):'',hasRounds?'':'Rundenscore offen'].filter(Boolean).join(' · ');
    card.append(board,node('div',label,'map'));list.append(card);
  }
}
async function update(){
  const started=Date.now();
  try{
    const res=await fetch(API,{cache:'no-store',credentials:'omit',signal:AbortSignal.timeout(26000)});
    const data=await res.json();
    if(!res.ok||data.error) throw Error(data.error||JSON.stringify(data.errors)||'HTTP '+res.status);
    if(!Array.isArray(data.matches))throw Error('Worker liefert noch das alte JSON-Format');
    if(data.errors?.length && !data.matches.length) throw Error(data.errors.map(x=>x.error).join('; '));
    if(!data.discovery?.match_links) throw Error('Matchübersicht konnte nicht gelesen werden');
    const stamp=Date.parse(data.fetched_at);if(!Number.isFinite(stamp)||Date.now()-stamp>60000) throw Error('Daten älter als 60 Sekunden');
    const byId=new Map(data.matches.map(m=>[m.id,m]));
    const sorted=lastMatches.map(m=>byId.get(m.id)).filter(Boolean);
    for(const m of data.matches)if(!sorted.some(x=>x.id===m.id))sorted.push(m);
    lastMatches=sorted;lastGood=Date.now();render(sorted);
    $('state').textContent=data.errors?.length?'Teilweise Daten fehlen':'';
    $('matches').title='Letzter Abruf: '+new Date(stamp).toLocaleTimeString('de-DE',{timeZone:'Europe/Berlin'});
  }catch(e){
    console.error(e);$('state').textContent='DATENFEHLER'+(lastGood&&Date.now()-lastGood<60000?' · VERALTET':'');
    if(!lastGood||Date.now()-lastGood>=60000){$('matches').replaceChildren(node('div','Datenabruf fehlgeschlagen: '+e.message,'empty'));}
  }finally{setTimeout(update,Math.max(1000,INTERVAL-(Date.now()-started)));}
}
update();
</script></body></html>
