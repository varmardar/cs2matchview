<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>CS2 Major – Live Overlay</title>
<style>
:root{--accent:#ffad32;--panel:rgba(15,18,25,.96);--ink:#f6f7fa;--muted:#a9b0bd;color-scheme:dark}*{box-sizing:border-box}html,body{margin:0;background:transparent;overflow:hidden;color:var(--ink);font-family:Arial,Helvetica,sans-serif}main{width:min(100%,1050px);padding:12px;margin:0 auto}header{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:0 3px 8px;font-size:12px;font-weight:800;letter-spacing:1.5px;text-shadow:0 1px 4px #000}header span:first-child{color:var(--accent)}#state{color:var(--muted);text-align:right}.matches{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}.match{background:var(--panel);border:1px solid #343944;border-top:3px solid var(--accent);border-radius:8px;padding:12px 13px 10px;min-width:0}.meta,.bottom{display:flex;justify-content:space-between;align-items:center;gap:6px;color:var(--muted);font-size:11px;font-weight:700;letter-spacing:.65px}.live{color:#ff6568}.upcoming{color:var(--accent)}.scoreboard{display:grid;grid-template-columns:minmax(0,1fr) auto minmax(0,1fr);align-items:center;gap:10px;padding:15px 0 12px}.team{display:flex;flex-direction:column;align-items:center;min-width:0;gap:7px}.logo{width:48px;height:48px;object-fit:contain;display:grid;place-items:center;font-size:21px;font-weight:900;color:var(--muted)}.name{font-size:15px;line-height:1.2;font-weight:800;text-align:center;overflow-wrap:anywhere}.scores{text-align:center;font-size:38px;font-weight:900;letter-spacing:-1.5px;font-variant-numeric:tabular-nums;white-space:nowrap}.scorelabel{font-size:10px;letter-spacing:1px;color:var(--muted);font-weight:700;text-align:center;margin-top:4px}.bottom{border-top:1px solid #353944;padding-top:9px;letter-spacing:0}.empty{grid-column:1/-1;background:var(--panel);padding:20px;border-radius:8px;color:var(--muted);text-align:center;font-size:15px}footer{text-align:right;color:#d0d3da;text-shadow:0 1px 4px #000;font-size:10px;margin-top:6px}#debug{display:none;white-space:pre-wrap;word-break:break-all;font:12px monospace;background:#141720;padding:12px;max-height:400px;overflow:auto}body.debug #debug{display:block}body.vertical .matches{grid-template-columns:1fr}body.vertical main{max-width:550px}@media(max-width:600px){.matches{grid-template-columns:1fr}} 
</style>
</head>
<body><main><header><span id="title">CS2 // MAJOR</span><span id="state" role="status">VERBINDE …</span></header><section class="matches" id="matches" aria-label="Matches"></section><footer id="footer">DATEN: BO3.GG</footer><pre id="debug"></pre></main>
<script>
'use strict';
const q=new URLSearchParams(location.search);
const config={event:q.get('event')||'PGL Major Singapore 2026',refresh:Math.max(15,Number(q.get('refresh'))||30)*1000,upcoming:q.get('upcoming')!=='0',demo:q.get('demo')==='1',debug:q.get('debug')==='1',source:q.get('source')||'direct',hideEmpty:q.get('hideEmpty')==='1'};
if(q.get('layout')==='vertical')document.body.classList.add('vertical');if(config.debug)document.body.classList.add('debug');
const $=id=>document.getElementById(id); const text=(tag,value,cls)=>{const el=document.createElement(tag);el.textContent=value??'';if(cls)el.className=cls;return el};
const first=(...values)=>values.find(v=>v!==undefined&&v!==null&&v!=='');
const arr=v=>Array.isArray(v)?v:[];const norm=v=>String(v??'').toLowerCase().replace(/[^a-z0-9]+/g,' ').trim();
const scalar=v=>typeof v==='string'||typeof v==='number'?v:undefined;
const numeric=v=>v!==null&&v!==undefined&&v!==''&&Number.isFinite(Number(v))?Number(v):null;
const status=v=>['current','live','running','in_progress','in progress'].includes(String(v).toLowerCase())?'live':String(v).toLowerCase();
const obj=v=>v&&typeof v==='object'&&!Array.isArray(v)?v:{};
function flatten(v){return {...obj(v),...obj(v?.attributes)}}
function unpack(payload){let p=payload;for(let i=0;i<4;i++){if(Array.isArray(p))return p.map(flatten);if(!p||typeof p!=='object')break;const next=first(p.matches,p.results,p.items,p.data,p.records);if(next===undefined||next===p)break;p=next;}throw Error('Unbekanntes JSON-Format – ?debug=1 zeigt Details.');}
function normalizeTeam(v){v=flatten(v);const t=flatten(v.team);return {...t,...v,name:first(scalar(v.name),scalar(t.name),scalar(v.short_name),scalar(t.short_name),'TBD'),id:first(v.team_id,t.id,v.id),logo:first(scalar(v.logo_url),scalar(t.logo_url),scalar(v.logo),scalar(t.logo),scalar(v.image_url),scalar(t.image_url),v.logo?.url,t.logo?.url,v.logo?.original,t.logo?.original,v.image?.url,t.image?.url),score:numeric(first(v.score,v.map_wins,v.maps_won,t.score))};}
function normalizeMatch(raw){const m=flatten(raw);let teams=arr(m.teams);if(!teams.length)teams=arr(m.match_teams);if(!teams.length)teams=[first(m.team1,m.team_1,m.home_team),first(m.team2,m.team_2,m.away_team)].filter(Boolean);let a=normalizeTeam(teams[0]),b=normalizeTeam(teams[1]);
 const tournament=flatten(first(m.tournament,m.event,m.tournament_deep));const event=first(scalar(tournament.name),scalar(tournament.title),scalar(m.tournament_name),scalar(m.event_name),scalar(m.event),scalar(tournament.slug),'');
 const games=arr(first(m.games,m.maps)).map(flatten);const active=games.find(g=>status(g.status)==='live');const completed=games.filter(g=>status(g.status)==='finished');
 const ma=numeric(first(m.team1_score,m.team_1_score,m.team1Score,m.score1,m.scores?.[0],a.score));const mb=numeric(first(m.team2_score,m.team_2_score,m.team2Score,m.score2,m.scores?.[1],b.score));
 function rounds(g,t,index){if(!g)return null;const gt=arr(first(g.teams,g.game_teams,g.scores));const match=gt.find(x=>String(first(x.team_id,x.team?.id,x.id))===String(t.id)&&t.id!=null);const aligned=match||((g.team1_id!=null&&String(g.team1_id)===String(t.id))?{score:g.team1_score}:((g.team2_id!=null&&String(g.team2_id)===String(t.id))?{score:g.team2_score}:null));return numeric(first(aligned?.score,aligned?.rounds_won,aligned?.round_score,typeof aligned==='number'?aligned:undefined));}
 const ra=rounds(active,a,0),rb=rounds(active,b,1);const map=first(scalar(active?.map_name),scalar(active?.map?.name),scalar(active?.map?.slug),scalar(active?.map),scalar(active?.name),'');
 return {id:String(first(m.id,m.slug,`${a.name}-${b.name}-${m.start_date}`)),event,teams:[a,b],state:status(first(m.status,m.is_live===true?'live':'upcoming')),start:first(m.start_date,m.start_time,m.begin_at,m.scheduled_at),bo:first(m.best_of,m.best_of_x,m.format,m.bo_type),map,series:[ma,mb],rounds:[ra,rb],completed:completed.length};}
function date(v){const t=Date.parse(v);return Number.isFinite(t)?t:Infinity}
let previous=[];function choose(rows){const target=norm(config.event);const unique=new Map();for(const r of rows){const m=normalizeMatch(r);if(norm(m.event).includes(target)&&['live','upcoming'].includes(m.state))unique.set(m.id,m)}const all=[...unique.values()];const live=all.filter(x=>x.state==='live').sort((a,b)=>{const ai=previous.indexOf(a.id),bi=previous.indexOf(b.id);return (ai<0?999:ai)-(bi<0?999:bi)||date(a.start)-date(b.start)||a.id.localeCompare(b.id)});const upcoming=all.filter(x=>x.state==='upcoming').sort((a,b)=>date(a.start)-date(b.start)||a.id.localeCompare(b.id));const selected=[...live,...(config.upcoming?upcoming:[])].slice(0,2);previous=selected.map(m=>m.id);return selected;}
function teamNode(t){const el=text('div','','team');const placeholder=text('div',t.name.slice(0,3).toUpperCase(),'logo');el.append(placeholder);if(t.logo){try{const url=new URL(t.logo,'https://bo3.gg');if(url.protocol==='https:'){const img=document.createElement('img');img.className='logo';img.alt='';img.referrerPolicy='no-referrer';img.onload=()=>placeholder.replaceWith(img);img.src=url.href;}}catch{}}el.append(text('div',t.name,'name'));return el;}
function fmtScore(s){return s.map(v=>v===null?'–':v).join(' : ')}
function startTime(m){if(!Number.isFinite(date(m.start)))return 'Zeit offen';return new Intl.DateTimeFormat('de-DE',{timeZone:'Europe/Berlin',day:'2-digit',month:'2-digit',hour:'2-digit',minute:'2-digit'}).format(new Date(m.start))+' Uhr';}
function render(list){$('matches').replaceChildren();if(!list.length){if(!config.hideEmpty)$('matches').append(text('div','Keine passenden Matches gefunden.','empty'));return;}for(const m of list){const card=text('article','','match');const meta=text('div','','meta');const live=m.state==='live';meta.append(text('span',live?'● LIVE':'NÄCHSTES MATCH',live?'live':'upcoming'),text('span',m.bo?(/^[0-9]+$/.test(String(m.bo))?'BO'+m.bo:String(m.bo).toUpperCase()):'CS2'));const board=text('div','','scoreboard');const center=text('div','');const hasRounds=m.rounds.every(x=>x!==null);center.append(text('div',live?fmtScore(hasRounds?m.rounds:m.series):'VS','scores'),text('div',live?(hasRounds?'RUNDEN':'MAPS'):'','scorelabel'));board.append(teamNode(m.teams[0]),center,teamNode(m.teams[1]));const bottom=text('div','','bottom');bottom.append(text('span',live?(m.map?m.map.replace(/^de_/,'').toUpperCase():'MAP OFFEN'):startTime(m)),text('span',live&&hasRounds?'Maps '+fmtScore(m.series):''));card.append(meta,board,bottom);$('matches').append(card);}}
function setState(s){$('state').textContent=s;}
const endpoint=new URL('https://api.bo3.gg/api/v1/matches');endpoint.search=new URLSearchParams({'scope':'widget-matches','page[offset]':'0','page[limit]':'100','sort':'tier_rank,-start_date','filter[matches.status][in]':'current,upcoming','filter[matches.discipline_id][eq]':'1','with':'teams,tournament,ai_predictions,games,streams'});
async function fetchJSON(url){const c=new AbortController();const t=setTimeout(()=>c.abort(),12000);try{const r=await fetch(url,{cache:'no-store',credentials:'omit',signal:c.signal,headers:{Accept:'application/json'}});if(!r.ok)throw Error('HTTP '+r.status);return await r.json();}finally{clearTimeout(t)}}
const demo=[{id:1,status:'current',tournament:{name:config.event},best_of:1,teams:[{id:1,name:'HEROIC',score:0},{id:2,name:'Imperial',score:0}],games:[{status:'current',map_name:'de_mirage',teams:[{team_id:1,score:9},{team_id:2,score:6}]}]},{id:2,status:'current',tournament:{name:config.event},best_of:3,teams:[{id:3,name:'FaZe',score:1},{id:4,name:'Wildcard',score:0}],games:[{status:'current',map_name:'de_nuke',teams:[{team_id:3,score:7},{team_id:4,score:8}]}]}];
let lastSuccess=0,lastList=[];
async function update(){try{if(config.demo){render(choose(demo));setState('DEMO · KEINE LIVE-DATEN');return;}let payload,source='BO3.GG',stamp=Date.now();if(config.source==='github'){const owner=location.hostname.endsWith('.github.io')?location.hostname.slice(0,-10):'';const repo=location.pathname.split('/').filter(Boolean)[0]||owner+'.github.io';const cache=q.get('cache')||(owner?'https://raw.githubusercontent.com/'+owner+'/'+repo+'/main/matches.json':new URL('matches.json',location.href).href);const file=await fetchJSON(cache);payload=file.payload;stamp=Date.parse(file.updated_at);if(!Number.isFinite(stamp))throw Error('Zeitstempel fehlt');if(Date.now()-stamp>15*60*1000)throw Error('GitHub-Daten älter als 15 Minuten');source='BO3.GG / GITHUB';}else{payload=await fetchJSON(endpoint.href);}if(config.debug)$('debug').textContent=JSON.stringify(payload,null,2);const list=choose(unpack(payload));render(list);lastList=list;lastSuccess=stamp;setState((list.filter(x=>x.state==='live').length)+' LIVE · '+new Date(stamp).toLocaleTimeString('de-DE',{timeZone:'Europe/Berlin'}));$('footer').textContent='DATEN: '+source+(config.source==='github'?' · VERZÖGERT':'');}catch(e){console.error('CS2 overlay:',e);const age=Date.now()-lastSuccess;setState('DATENFEHLER'+(lastSuccess&&age<120000?' · VERALTET':''));if(!lastSuccess||age>=120000){$('matches').replaceChildren();$('matches').append(text('div','Keine aktuellen Daten. API/CORS oder Verbindung prüfen.','empty'));}if(config.debug)$('debug').textContent=String(e)+'\n'+endpoint.href+'\n'+$('debug').textContent;}finally{if(!config.demo)setTimeout(update,config.refresh);}}
$('title').textContent=config.event.toUpperCase();update();
</script></body></html>
